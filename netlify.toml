# Netlify — déploiement MOUVANCIA (Next.js, adaptateur auto-détecté).
#
# Split vitrine / application par sous-domaine : on définit NEXT_PUBLIC_APP_URL
# UNIQUEMENT en production. Le middleware (src/proxy.ts) sert alors la vitrine sur
# le domaine racine (mouvancia.fr) et renvoie les routes applicatives vers
# app.mouvancia.fr. Les Deploy Previews (par branche/PR) n'ont pas la variable →
# tout reste sur un seul host, comportement de test inchangé.
#
# Prérequis côté Netlify/DNS (à faire dans l'interface, voir README) :
#   1. Ajouter app.mouvancia.fr comme domaine du site (alias).
#   2. DNS : CNAME `app` → la cible Netlify du site.
#   3. Vérifier que les variables Supabase sont bien définies (build + runtime).

[context.production.environment]
  NEXT_PUBLIC_APP_URL = "https://app.mouvancia.fr"

# ── Cache des gros assets statiques ──────────────────────────────────────────
# Sans ces headers, les ~90 Mo de data (tuiles, Parquet) se revalident à chaque
# session. Les noms de fichiers ne sont pas versionnés → pas d'`immutable` :
# on combine un max-age raisonnable avec stale-while-revalidate (le CDN sert
# l'ancien pendant qu'il rafraîchit en arrière-plan).

# Tuiles vectorielles (contours administratifs : changent ~jamais).
[[headers]]
  for = "/tiles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Parquet électoraux & sociologie INSEE (mis à jour à chaque refresh data).
[[headers]]
  for = "/electoral/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/insee/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Bundles DuckDB-WASM self-hostés (changent à chaque bump de dépendance).
[[headers]]
  for = "/duckdb/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Index de recherche & données fraîches (députés, sondages, suivi quotidien).
[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/an/*"
  [headers.values]
    Cache-Control = "public, max-age=900, stale-while-revalidate=3600"

[[headers]]
  for = "/sondages/*"
  [headers.values]
    Cache-Control = "public, max-age=900, stale-while-revalidate=3600"

[[headers]]
  for = "/suivi/*"
  [headers.values]
    Cache-Control = "public, max-age=900, stale-while-revalidate=3600"
