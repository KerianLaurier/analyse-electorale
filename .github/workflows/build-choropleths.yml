name: Build choroplèthes + détail → Supabase Storage

# Régénère les données figées servant la carte SANS DuckDB-WASM et les pousse au
# bucket Storage `data` :
#   - choroplèthes  public/electoral/choro/*.json   (coloriage)
#   - détail        public/electoral/detail/*.json  (fiches au clic + historiques)
# Auto-suffisant : télécharge les Parquet sources DEPUIS le storage (ils ne sont
# plus dans git, cf. #47), lance le précalcul, puis uploade. Pas besoin des
# sources brutes (data/raw) ni du pipeline complet.
# Inclut le détail et la socio au niveau bureau de vote (agrégats bureaux +
# bureaux_socio téléchargés ci-dessous).
#
# Déclenchement manuel (un clic). À relancer après chaque mise à jour des
# agrégats électoraux ou des données socio. Prérequis : secret
# SUPABASE_SERVICE_ROLE_KEY. cf. docs/object-store.md
#
# N'altère rien tant que NEXT_PUBLIC_DATA_URL n'est pas définie côté déploiement.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DATA_BASE: https://fdfghtrxczauvrbmdxlq.supabase.co/storage/v1/object/public/data

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer duckdb
        run: pip install duckdb

      - name: Télécharger les Parquet sources depuis le storage
        run: |
          set -euo pipefail
          mkdir -p public/electoral/agg public/electoral/trends public/insee
          dl() { curl -fsS -o "public/$1" "$DATA_BASE/$1" && echo "↓ $1"; }
          for s in presid-2017-t1 presid-2017-t2 presid-2022-t1 presid-2022-t2 \
                   legis-2017-t1 legis-2017-t2 \
                   legis-2022-t1 legis-2022-t2 legis-2024-t1 legis-2024-t2 \
                   euro-2019-t1 euro-2024-t1 \
                   municipales-2026-t1 municipales-2026-t2; do
            dl "electoral/agg/${s}_candidats.parquet"
            dl "electoral/agg/${s}_territoires.parquet"
          done
          # Agrégats au niveau bureau (détail bureau de vote) — scrutins avec bureaux.
          # (nouveaux scrutins : produits par le workflow build-aggregates, à lancer AVANT)
          for s in presid-2017-t1 presid-2017-t2 presid-2022-t1 presid-2022-t2 \
                   legis-2017-t1 legis-2017-t2 \
                   legis-2022-t1 legis-2022-t2 legis-2024-t1 legis-2024-t2 \
                   euro-2019-t1 euro-2024-t1; do
            dl "electoral/agg/${s}_bureaux_candidats.parquet"
            dl "electoral/agg/${s}_bureaux_territoires.parquet"
          done
          for f in filosofi_2021_commune rp_2022_commune logement_2022_commune \
                   famille_2022_commune mobilite_2022_commune structpop_2022_commune \
                   bureaux_socio circo_socio; do
            dl "insee/${f}.parquet"
          done
          dl "electoral/potentiel_commune.parquet"
          dl "electoral/trends/presid_2017_2022.parquet"
          dl "electoral/trends/legis_2022_2024.parquet"

      - name: Précalculer les choroplèthes
        run: python3 scripts/pipeline/build-choropleths.py

      - name: Précalculer le détail par territoire
        run: python3 scripts/pipeline/build-territory-detail.py

      - name: Précalculer les agrégats d'analyse
        run: python3 scripts/pipeline/build-analysis.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Installer les deps
        run: npm ci

      - name: Upload vers Supabase Storage
        env:
          SUPABASE_URL: https://fdfghtrxczauvrbmdxlq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONLY: electoral
        run: node scripts/pipeline/upload-storage.mjs
