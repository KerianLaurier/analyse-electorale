name: Suivi — refresh données quotidiennes

# Rafraîchit chaque jour les flux du module Suivre :
#   - notices de sondages (Commission des sondages)
#   - scrutins publics (Assemblée nationale, 17e législature)
#   - dossiers législatifs (Assemblée nationale)
#   - agenda électoral (curé)
# Commit les JSON dans public/suivi + public/sondages s'ils ont changé.
#
# Activation : repo sur GitHub + Settings → Actions → "Read and write
# permissions". Le GITHUB_TOKEN par défaut suffit (permission ci-dessous).

on:
  schedule:
    - cron: "30 6 * * *" # tous les jours 06:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (parsing PDF + agrégation sondages)
        run: pip install --quiet pdfplumber pandas lxml

      # Chaque flux est indépendant : si l'un échoue (HTML source modifié, flux
      # média indispo…), on l'ignore et on continue, afin que les autres soient
      # tout de même rafraîchis et commités. Évite qu'un seul feed fragile bloque
      # la mise à jour quotidienne complète.
      - name: Refresh feeds
        run: |
          for s in build-cncs-notices build-cncs-parse build-polls-2027 build-an-votes build-an-lois build-agenda build-veille; do
            echo "→ $s"
            python3 "scripts/pipeline/$s.py" || echo "::warning::$s a échoué — ignoré"
          done

      - name: Commit if changed
        if: always()
        run: |
          CHANGED=$(git status --porcelain public/sondages public/suivi scripts/pipeline/parse-cache.json)
          if [[ -n "$CHANGED" ]]; then
            git config user.name "mouvancia-bot"
            git config user.email "bot@mouvancia.app"
            git add public/sondages public/suivi scripts/pipeline/parse-cache.json
            git commit -m "chore(suivi): refresh données $(date -u +%Y-%m-%d)"
            git push
            echo "✓ données mises à jour"
          else
            echo "= aucun changement"
          fi

      # Si la donnée est servie depuis l'object store (cf. docs/object-store.md),
      # on y pousse aussi les flux rafraîchis. Sans le secret, l'étape est ignorée
      # (tant que le storage n'est pas activé, rien à faire).
      - name: Setup Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Push refreshed data to Supabase Storage
        if: always()
        env:
          SUPABASE_URL: https://fdfghtrxczauvrbmdxlq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONLY: sondages,suivi
        run: |
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "= SUPABASE_SERVICE_ROLE_KEY absent → upload storage ignoré"
            exit 0
          fi
          npm ci
          node scripts/pipeline/upload-storage.mjs
