name: CI

# Qualité sur chaque PR et sur main : lint, types, tests unitaires (Vitest)
# et parcours E2E publics (Playwright — la suite authentifiée est ignorée
# sans identifiants de test, cf. e2e/authentifie.spec.ts).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Aucun accès aux comptes ou paiements réels dans la suite publique.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Contrats du pipeline sur données fictives
        run: python -m unittest discover -s scripts/pipeline/tests -v

      - name: Syntaxe des pipelines
        run: |
          bash -n scripts/pipeline/all.sh
          python3 -m compileall -q scripts/pipeline

      - name: Navigateur Playwright
        run: npx playwright install chromium --with-deps

      - name: Tests E2E (parcours publics)
        run: npm run test:e2e

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
