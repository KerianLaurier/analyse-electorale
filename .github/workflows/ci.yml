name: CI

# Qualité sur chaque PR et sur main : lint, types, tests unitaires (Vitest)
# et parcours E2E publics (Playwright — la suite authentifiée est ignorée
# sans identifiants de test, cf. e2e/authentifie.spec.ts).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Tests unitaires
        run: npm test

      - name: Navigateur Playwright
        run: npx playwright install chromium --with-deps

      - name: Tests E2E (parcours publics)
        run: npm run test:e2e

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
